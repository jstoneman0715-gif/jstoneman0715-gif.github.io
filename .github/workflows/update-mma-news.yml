name: Update MMA News Twice Daily

on:
  schedule:
    - cron: '0 0 * * *'
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Fetch MMA news
        env:
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
        run: node agents/mma-news-updater/fetch-mma-news.js

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add agents/src/data/mma-news.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update MMA news" && git push)
