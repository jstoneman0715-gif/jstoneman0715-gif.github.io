<svg viewBox="0 0 1050 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="stripes" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="16" height="16" fill="#131316"/>
      <rect width="8" height="16" fill="#17171b"/>
    </pattern>
  </defs>
  <rect width="1050" height="300" fill="url(#stripes)"/>

  <!-- career trajectory arc: rise, peak, decline -->
  <path d="M70,250 C230,250 300,70 500,60 C680,50 850,110 990,150" fill="none" stroke="#d4a24e" stroke-width="5" opacity="0.7"/>
  <circle cx="70" cy="250" r="7" fill="#d4a24e" opacity="0.8"/>
  <circle cx="500" cy="60" r="9" fill="#e0263e"/>
  <circle cx="990" cy="150" r="7" fill="#d4a24e" opacity="0.8"/>
  <text x="70" y="272" font-family="Arial, sans-serif" font-size="14" fill="#a7a7ae" text-anchor="middle">DEBUT</text>
  <text x="500" y="40" font-family="Arial, sans-serif" font-size="14" fill="#f3f3f2" text-anchor="middle">PEAK</text>
  <text x="990" y="172" font-family="Arial, sans-serif" font-size="14" fill="#a7a7ae" text-anchor="middle">NOW</text>

  <!-- fighter silhouette near the peak -->
  <g fill="#e0263e" opacity="0.9" transform="translate(440,95) scale(0.85)">
    <circle cx="70" cy="22" r="13"/>
    <polygon points="55,34 85,34 92,78 78,95 52,95 42,78"/>
    <polygon points="52,95 44,95 18,150 32,156 58,102"/>
    <polygon points="78,95 88,95 102,140 116,158 98,160 82,108"/>
    <polygon points="58,40 46,36 34,54 44,64 58,50"/>
    <circle cx="38" cy="59" r="8"/>
    <polygon points="82,38 100,30 122,16 128,26 104,44 88,50"/>
    <circle cx="124" cy="21" r="9"/>
  </g>

  <rect x="0" y="292" width="1050" height="8" fill="#d4a24e" opacity="0.5"/>
</svg>
