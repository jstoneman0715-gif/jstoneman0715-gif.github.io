<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MMA News</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #1a1a1a; color: #fff; }
        h1 { color: #ff6b6b; }
        .article { border: 1px solid #444; padding: 15px; margin: 10px 0; border-radius: 5px; }
        .article h2 { margin: 0 0 10px 0; }
        .article img { max-width: 300px; margin: 10px 0; }
        .article a { color: #4ecdc4; text-decoration: none; }
    </style>
</head>
<body>
    <h1>🥊 MMA News</h1>
    <div id="articles"></div>
    <script>
        const API_URL = "/agents/mma-news-updater/mma-news.json";
        fetch(API_URL)
            .then(r => r.json())
            .then(data => {
                const container = document.getElementById("articles");
                data.articles.forEach(article => {
                    const div = document.createElement("div");
                    div.className = "article";
                    const img = article.image ? `<img src="${article.image}" alt="${article.title}" />` : "";
                    div.innerHTML = `<h2>${article.title}</h2>${img}<p>${article.description}</p><a href="${article.url}" target="_blank">Read more →</a>`;
                    container.appendChild(div);
                });
            })
            .catch(e => console.error("Error loading articles:", e));
    </script>
</body>
</html>
