<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>MMA News — Fightonomics</title>
  <link rel="icon" type="image/svg+xml" href="/images/avatar-glove.svg">
  <meta name="description" content="Breaking MMA headlines and event coverage, auto-updated throughout the day.">
  <link rel="canonical" href="https://jstoneman0715-gif.github.io/mma-news/">
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial; background:#f6f8fb;color:#111;margin:0;padding:24px}
    .container{max-width:1100px;margin:0 auto}
    h1{margin-bottom:8px}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px;margin-top:20px}
    .card{background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 6px 18px rgba(0,0,0,.08);display:flex;flex-direction:column}
    .card img{width:100%;height:180px;object-fit:cover}
    .content{padding:16px;display:flex;flex-direction:column;flex:1}
    .title{font-weight:700;margin-bottom:8px}
    .desc{color:#555;flex:1}
    .meta{display:flex;justify-content:space-between;align-items:center;margin-top:12px}
    .btn{background:#0070f3;color:#fff;padding:8px 12px;border-radius:6px;text-decoration:none}
    .empty{padding:40px;text-align:center;color:#666}
  </style>
</head>
<body>
  <div class="container">
    <h1>🥊 MMA News</h1>
    <p>Latest MMA headlines (auto-updated)</p>
    <div id="grid" class="grid"></div>
    <div id="empty" class="empty" style="display:none">No articles yet.</div>
  </div>

  <script>
    async function load() {
      try {
        const res = await fetch('/agents/mma-news-updater/mma-news.json');
        if (!res.ok) throw new Error('Failed to fetch');
        const data = await res.json();
        const grid = document.getElementById('grid');
        const empty = document.getElementById('empty');
        const articles = data.articles || [];
        if (articles.length === 0) { empty.style.display = 'block'; return }
        articles.forEach(a => {
          const card = document.createElement('article'); card.className='card';
          const cont = document.createElement('div'); cont.className='content';
          const t = document.createElement('div'); t.className='title'; t.textContent = a.title || '';
          const d = document.createElement('div'); d.className='desc'; d.textContent = a.description || '';
          const m = document.createElement('div'); m.className='meta';
          const date = document.createElement('span'); date.textContent = a.publishedAt ? new Date(a.publishedAt).toLocaleString() : '';
          const link = document.createElement('a'); link.className='btn'; link.href = a.url || '#'; link.target='_blank'; link.rel='noopener'; link.textContent='Read';
          m.appendChild(date); m.appendChild(link);
          cont.appendChild(t); cont.appendChild(d); cont.appendChild(m);
          if (a.image) {
            const img = document.createElement('img'); img.src = a.image; img.alt = a.title || ''; img.loading = 'lazy';
            img.onerror = () => img.remove();
            card.appendChild(img);
          }
          card.appendChild(cont);
          grid.appendChild(card);
        });
      } catch (e) {
        document.getElementById('empty').textContent = 'Error loading articles.'; document.getElementById('empty').style.display='block';
        console.error(e)
      }
    }
    load();
  </script>
</body>
</html>
